<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario - Productos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="mb-4 text-center">Gestión de Inventario - Productos</h1>

        <div class="row">
            <!-- Formulario de Producto (Crear / Editar) -->
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3" id="formTitulo">Nuevo Producto</h4>
                    <form id="productoForm">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="precio_venta" class="form-label">Precio</label>
                            <input type="number" step="0.01" class="form-control" id="precio_venta" required>
                        </div>
                        <div class="mb-3">
                            <label for="stock_actual" class="form-label">Stock Actual</label>
                            <input type="number" class="form-control" id="stock_actual" required>
                        </div>
                        <div class="mb-3">
                            <label for="stock_max" class="form-label">Stock Máximo</label>
                            <input type="number" class="form-control" id="stock_max" required>
                        </div>

                        <!-- Campos de Ubicación (IDs exactos requeridos por el backend) -->
                        <fieldset class="border p-3 rounded mb-3">
                            <legend class="float-none w-auto px-2 fs-6 fw-semibold text-secondary">Ubicación</legend>
                            <div class="mb-2">
                                <label for="pasillo" class="form-label">Pasillo</label>
                                <input type="text" class="form-control" id="pasillo" required>
                            </div>
                            <div class="mb-2">
                                <label for="estante" class="form-label">Estante</label>
                                <input type="text" class="form-control" id="estante" required>
                            </div>
                            <div class="mb-2">
                                <label for="nivel" class="form-label">Nivel</label>
                                <input type="text" class="form-control" id="nivel" required>
                            </div>
                        </fieldset>

                        <button type="submit" id="btnSubmit" class="btn btn-primary w-100">Guardar</button>
                        <button type="button" id="btnCancelar" class="btn btn-secondary w-100 mt-2 d-none" onclick="resetearFormulario()">Cancelar Edición</button>
                    </form>
                </div>
            </div>

            <!-- Lista de Artículos -->
            <div class="col-md-7">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3">Lista de Artículos</h4>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Nombre</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th>Máx</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaProductos">
                                <!-- Los productos se cargan dinámicamente aquí -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Lógica Frontend -->
    <script>
        const API_URL = 'http://localhost:3000/api/productos';
        let productoEditandoId = null;

        async function cargarProductos() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Error al obtener los productos');
                const productos = await response.json();
                
                const tbody = document.getElementById('tablaProductos');
                tbody.innerHTML = '';

                productos.forEach(prod => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${prod.nombre}</td>
                            <td>$${prod.precio_venta}</td>
                            <td>${prod.stock_actual}</td>
                            <td>${prod.stock_max}</td>
                            <td>
                                <button class="btn btn-sm btn-warning me-1" onclick='cargarParaEditar(${prod.id}, ${JSON.stringify(prod.nombre)}, ${JSON.stringify(prod.descripcion || "")}, ${prod.precio_venta}, ${prod.stock_actual}, ${prod.stock_max})'>Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="eliminarProducto(${prod.id})">Eliminar</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error al cargar productos:", error);
            }
        }

        document.getElementById('productoForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const datosProducto = {
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value,
                precio_venta: parseFloat(document.getElementById('precio_venta').value),
                stock_actual: parseInt(document.getElementById('stock_actual').value),
                stock_minimo: 1,
                stock_max: parseInt(document.getElementById('stock_max').value),
                pasillo: document.getElementById('pasillo').value,
                estante: document.getElementById('estante').value,
                nivel: document.getElementById('nivel').value,
                codigo_barras: "779" + Math.floor(Math.random() * 1000000000),
                categoria_id: 1
            };

            try {
                let url = API_URL;
                let method = 'POST';

                if (productoEditandoId) {
                    url = `${API_URL}/${productoEditandoId}`;
                    method = 'PUT';
                }

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosProducto)
                });

                if (!response.ok) throw new Error('Error al guardar el producto');

                resetearFormulario();
                cargarProductos();
            } catch (error) {
                console.error("Error al procesar la solicitud:", error);
                alert("No se pudo guardar el producto.");
            }
        });

        function cargarParaEditar(id, nombre, descripcion, precio, stock, stockMax) {
            productoEditandoId = id;
            document.getElementById('nombre').value = nombre;
            document.getElementById('descripcion').value = descripcion;
            document.getElementById('precio_venta').value = precio;
            document.getElementById('stock_actual').value = stock;
            document.getElementById('stock_max').value = stockMax;

            document.getElementById('formTitulo').textContent = 'Editar Producto';
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.textContent = 'Actualizar Producto';
            btnSubmit.classList.remove('btn-primary');
            btnSubmit.classList.add('btn-warning');

            document.getElementById('btnCancelar').classList.remove('d-none');
        }

        function resetearFormulario() {
            productoEditandoId = null;
            document.getElementById('productoForm').reset();
            document.getElementById('formTitulo').textContent = 'Nuevo Producto';
            
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.textContent = 'Guardar';
            btnSubmit.classList.remove('btn-warning');
            btnSubmit.classList.add('btn-primary');

            document.getElementById('btnCancelar').classList.add('d-none');
        }

        async function eliminarProducto(id) {
            if (!confirm('¿Estás seguro de eliminar este producto?')) return;
            try {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                cargarProductos();
            } catch (error) {
                console.error("Error al eliminar:", error);
            }
        }

        cargarProductos();
    </script>
</body>
</html>
